<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Snake Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: #0f0f1a;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      position: relative;
    }

    #game-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #0f0f1a;
    }

    #start-container {
      position: absolute;
      inset: 0;
      z-index: 10;
      width: 100%;
      height: 100%;
      pointer-events: auto;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.05);
        opacity: 0.85;
      }
    }

    /* floating directional pad: transparent, fixed to bottom-right */
    #controls {
      position: fixed;
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      z-index: 30;
      display: inline-block;
      padding: 8px;
      background: rgba(0,0,0,0.12);
      border-radius: 50%;
      backdrop-filter: blur(6px);
      transition: opacity 0.2s ease, visibility 0.2s;
      pointer-events: auto;
    }

    #controls.hidden {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(3, 56px);
      gap: 6px;
    }

    .dpad-btn {
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dpad-btn:active {
      background: rgba(255, 255, 255, 0.28);
    }

    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 3; }
    #btn-right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>
  <div id="app">
    <div id="start-container"></div>
    <div id="game-container"></div>
    <div id="controls" class="hidden">
      <div class="dpad">
        <button class="dpad-btn" id="btn-up" aria-label="Up">↑</button>
        <button class="dpad-btn" id="btn-left" aria-label="Left">←</button>
        <button class="dpad-btn" id="btn-down" aria-label="Down">↓</button>
        <button class="dpad-btn" id="btn-right" aria-label="Right">→</button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="game.js" type="module"></script>
</body>
</html>
